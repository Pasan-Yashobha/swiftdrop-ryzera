<ol class="line" [class.line--light]="variant() === 'light'" aria-label="Delivery progress">
  @for (stop of stops(); track stop.stop) {
    <li
      class="stop"
      [attr.data-state]="stop.state"
      [attr.aria-current]="stop.state === 'CURRENT' || stop.state === 'ATTENTION' || stop.state === 'EXCEPTION' ? 'step' : null"
    >
      <span class="dot" aria-hidden="true">
        @if (stop.state === 'EXCEPTION') {
          &#x2715;
        } @else {
          {{ number(stop.stop) }}
        }
      </span>
      <span class="label">{{ stop.label }}</span>
      <span class="time">{{ stop.at ? (stop.at | date: 'HH:mm') : '' }}</span>
      <span class="visually-hidden">, {{ stateText(stop.state) }}</span>
    </li>
  }
</ol>
