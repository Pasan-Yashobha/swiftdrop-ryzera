<header class="header">
  <div class="container header__bar">
    <a class="header__brand" routerLink="/dashboard">
      SwiftDrop <span class="header__brand-sub">Customer</span>
    </a>

    <button
      type="button"
      class="header__toggle btn btn-secondary btn-sm"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      Menu
    </button>

    <nav
      id="primary-nav"
      class="header__nav"
      [class.header__nav--open]="menuOpen()"
      aria-label="Primary navigation"
    >
      <ul class="header__links">
        @for (link of links(); track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="header__link--active"
              ariaCurrentWhenActive="page"
              class="header__link"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="header__actions cluster" style="gap: var(--space-2);">
        @if (isAuthenticated()) {
          <span class="muted small header__user-name">
            {{ user()?.fullName }}
          </span>
          <a routerLink="/book" class="btn btn-primary btn-sm">
            + Book Delivery
          </a>
          <button type="button" class="btn btn-secondary btn-sm" (click)="onSignOut()">
            Sign Out
          </button>
        } @else {
          <a routerLink="/login" class="header__link" style="margin-right: var(--space-1);">
            Sign In
          </a>
          <a routerLink="/signup" class="btn btn-primary btn-sm">
            Sign Up
          </a>
        }
      </div>
    </nav>
  </div>
</header>
