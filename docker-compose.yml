name: swiftdrop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_admin_pw}
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-dev_service_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftdrop_admin} -d ${POSTGRES_DB:-swiftdrop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [swiftdrop]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev_rabbit_pw}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [swiftdrop]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev_redis_pw}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pw}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [swiftdrop]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (services send here)
      - "8025:8025"   # web inbox
    networks: [swiftdrop]

  identity:
    build:
      context: ./services/identity
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${IDENTITY_SPRING_PROFILES:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: identity_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD:-dev_service_pw}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      CORS_ALLOWED_ORIGINS: ${IDENTITY_CORS_ALLOWED_ORIGINS:-http://localhost:4201,http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      - "8081:8080"
    networks: [swiftdrop]

  merchant:
    build:
      context: ./services/merchant
    restart: unless-stopped
    # Longer than the 30 s graceful shutdown of the service, or Docker kills it after 10 s.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${MERCHANT_SPRING_PROFILES:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/merchant_db
      SPRING_DATASOURCE_USERNAME: merchant_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD:-dev_service_pw}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-swiftdrop}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev_rabbit_pw}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity:8080/.well-known/jwks.json}
      # The same development defaults as application-dev.yml, so the service behaves the same from the IDE.
      DEV_JWT_HMAC_SECRET: ${DEV_JWT_HMAC_SECRET:-dev-only-hmac-secret-change-me-0123456789}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      MERCHANT_TOKEN_SECRET: ${MERCHANT_TOKEN_SECRET:-dev-only-merchant-token-secret-0123456789}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-ZGV2LW9ubHktd2ViaG9vay1rZXktMDEyMzQ1Njc4ISE=}
      CORS_ALLOWED_ORIGINS: ${MERCHANT_CORS_ALLOWED_ORIGINS:-http://localhost:4201,http://localhost:4200}
      PARCEL_SERVICE_URL: ${PARCEL_SERVICE_URL:-http://parcel:8080}
      WEBHOOK_SERVICE_URL: ${WEBHOOK_SERVICE_URL:-http://webhook:8080}
      PUBLIC_TRACKING_URL: ${PUBLIC_TRACKING_URL:-http://localhost:4200/track}
    ports:
      - "8083:8080"
    networks: [swiftdrop]

  merchant-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.merchant-portal
      args:
        NG_CONFIGURATION: ${MERCHANT_PORTAL_CONFIGURATION:-development}
    restart: unless-stopped
    depends_on:
      - merchant
    environment:
      API_UPSTREAM: ${MERCHANT_PORTAL_API_UPSTREAM:-http://merchant:8080}
    ports:
      - "4201:8080"
    networks: [swiftdrop]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks: [swiftdrop]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev_grafana_pw}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"   
    depends_on:
      - prometheus
    networks: [swiftdrop]

networks:
  swiftdrop:
    name: swiftdrop

volumes:
  pgdata:
  rabbitmqdata:
  promdata:
  grafanadata:
