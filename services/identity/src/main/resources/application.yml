spring:
  application:
    name: identity-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

swiftdrop:
  security:
    jwt-issuer: ${JWT_ISSUER:swiftdrop-identity}
    jwt-private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    jwt-public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 7
    refresh-token-family-max-days: 30
    internal-token: ${INTERNAL_API_TOKEN:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    bcrypt-cost: 12
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  recovery:
    token-ttl-minutes: 15
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
