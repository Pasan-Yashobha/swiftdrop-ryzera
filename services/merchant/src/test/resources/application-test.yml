# Test profile: H2 in PostgreSQL mode running the real Flyway migration; no broker, no schedulers.
# All secrets below are dummy values that exist only for the test run.

spring:
  datasource:
    url: jdbc:h2:mem:merchant-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

swiftdrop:
  scheduling:
    enabled: false
  orders:
    pending-placeholder-max-age-seconds: 300
  security:
    dev-hmac-secret: test-only-hmac-secret-0123456789abcdef
    internal-token: test-internal-token
    merchant-token-secret: test-only-merchant-token-secret-0123456789
  outbox:
    enabled: false
  webhook:
    encryption-key: dGVzdC1vbmx5LXdlYmhvb2sta2V5LTAxMjM0NTY3ISE=
    allow-private-hosts: true
