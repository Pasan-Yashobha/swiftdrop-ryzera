# Merchant Service configuration.
# No secrets live here: every secret comes from an environment variable (see services/merchant/README.md).
# Local development defaults are in application-dev.yml (profile "dev").

spring:
  application:
    name: merchant-service
  # Datasource and broker settings are bound from SPRING_DATASOURCE_* and SPRING_RABBITMQ_*.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Event envelopes from other services may grow new fields; ignore what we do not know.
      fail-on-unknown-properties: false
  servlet:
    multipart:
      # Slightly above swiftdrop.bulk.max-bytes so the importer's own size check produces the friendly error.
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

swiftdrop:
  security:
    identity-jwks-uri: ${IDENTITY_JWKS_URI:}
    jwt-issuer: ${JWT_ISSUER:}
    dev-hmac-secret: ${DEV_JWT_HMAC_SECRET:}
    internal-token: ${INTERNAL_API_TOKEN:}
    merchant-token-secret: ${MERCHANT_TOKEN_SECRET:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    confirm-timeout-ms: 5000
  parcel:
    base-url: ${PARCEL_SERVICE_URL:http://parcel:8080}
  webhook:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:}
    delivery-log-url: ${WEBHOOK_SERVICE_URL:http://webhook:8080}
    allow-insecure-urls: ${WEBHOOK_ALLOW_INSECURE_URLS:false}
    allow-private-hosts: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:false}
  tracking:
    public-url: ${PUBLIC_TRACKING_URL:http://localhost:4200/track}
