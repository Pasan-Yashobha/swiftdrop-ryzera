  /oauth/token:
    post:
      tags: [Authentication]
      operationId: createToken
      summary: Get an access token (OAuth 2.0 client credentials)
      description: |
        The OAuth 2.0 client credentials grant of RFC 6749 section 4.4. Create an OAuth client in the portal
        (*Developers, API keys, OAuth clients*) to get a `client_id` and a `client_secret`.

        **Client authentication**, exactly one of:

        * HTTP Basic: `Authorization: Basic base64(urlencode(client_id) + ":" + urlencode(client_secret))`
        * the form fields `client_id` and `client_secret`

        Sending both is `invalid_request`. The parameters must be in the **request body**
        (`application/x-www-form-urlencoded`); parameters in the URL are refused with `invalid_request` so that
        secrets never reach access logs. Any other content type gets a `415` in the usual `ApiError` format.

        `scope` is optional: a space separated subset of the scopes of the client (`orders:write`,
        `orders:read`). Without it the token gets all scopes of the client. Asking for a scope the client does not
        have is `invalid_scope`.

        The token is a signed JWT. Treat it as opaque; only the Merchant Service can verify it. It carries the
        environment (LIVE or TEST) of the client. Use it as `Authorization: Bearer <access_token>` on
        `/merchant-api` calls and request a new one before `expires_in` seconds have passed.

        A client that is revoked, unknown, has a wrong secret, or whose merchant is not approved always gets the
        same `401 invalid_client`, so the endpoint reveals nothing about clients or merchants. The request budget
        of `/merchant-api` does not apply to this endpoint. Responses are never cacheable.
      security:
        - ClientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              basic:
                summary: Client authenticates with HTTP Basic (body carries grant and scope only)
                value:
                  grant_type: client_credentials
                  scope: orders:write orders:read
              formFields:
                summary: Client authenticates with form fields
                value:
                  grant_type: client_credentials
                  client_id: mc_k3j9x0q2w8e4r6t7y1u5
                  client_secret: Zk0pQw8dTn3VbX7cLm2aSj9RfHy4GuE6IoP1AsDqWxk
                  scope: orders:read
      responses:
        '200':
          description: An access token was issued.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
            Pragma:
              description: Always `no-cache`.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                token:
                  summary: Token with both scopes
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzd2lmdGRyb3AtbWVyY2hhbnQtc2VydmljZSJ9.c2lnbmF0dXJl
                    token_type: Bearer
                    expires_in: 3600
                    scope: orders:write orders:read
        '400':
          description: |
            The request is invalid. `error` is one of:

            * `invalid_request`: parameters in the URL, both client authentication methods at once, or a missing
              `grant_type`.
            * `unsupported_grant_type`: `grant_type` is not `client_credentials`.
            * `invalid_scope`: the requested scope exceeds the scopes of the client.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
            Pragma:
              description: Always `no-cache`.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              examples:
                invalidRequest:
                  summary: grant_type missing
                  value:
                    error: invalid_request
                    error_description: The grant_type parameter is required
                unsupportedGrantType:
                  summary: Another grant type
                  value:
                    error: unsupported_grant_type
                    error_description: Only the client_credentials grant is supported
                invalidScope:
                  summary: Scope the client does not have
                  value:
                    error: invalid_scope
                    error_description: The requested scope exceeds the scope of the client
        '401':
          description: Client authentication failed (`invalid_client`), for whatever reason.
          headers:
            WWW-Authenticate:
              description: |
                `Basic realm="swiftdrop-merchant-api", charset="UTF-8"`. Present when Basic authentication was
                attempted or no client authentication was sent at all; absent when form fields were used.
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                const: no-store
            Pragma:
              description: Always `no-cache`.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              examples:
                invalidClient:
                  summary: Unknown client or wrong secret
                  value:
                    error: invalid_client
                    error_description: Client authentication failed
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A merchant API key, `sd_live_...` or `sd_test_...`, created in the portal. Grants both `orders:read` and
        `orders:write`. LIVE keys create real parcels, TEST keys work in sandbox mode.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `access_token` returned by `POST /oauth/token`, sent as `Authorization: Bearer <access_token>`.
        This is the same credential as `OAuth2ClientCredentials`; the scopes are those granted to the token.
    OAuth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials grant (RFC 6749 section 4.4) with a client created in the portal.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            orders:read: Look up and list orders.
            orders:write: Create orders and advance sandbox orders.
    ClientBasicAuth:
      type: http
      scheme: basic
      description: |
        Client authentication of the token endpoint: `client_id` as user name and `client_secret` as password,
        each URL encoded before the Base64 step (RFC 6749 section 2.3.1).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes the request safe to repeat. Up to 100 characters (longer is `400 VALIDATION_FAILED`), unique per
        order you intend to create. See *Idempotency* in the overview.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        examples: [order-1001-attempt-1]
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Your own id for the request, 1 to 64 characters of `A-Z a-z 0-9 . _ : -`. Generated when absent or when
        the value is not acceptable. Echoed in the response.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]{1,64}$'
        examples: [shop-backend-7f3a9c]
    TrackingNo:
      name: trackingNo
      in: path
      required: true
      description: Tracking number of the order, as returned when it was created (`SD...` live, `SBX...` sandbox).
      schema:
        type: string
        minLength: 1
        maxLength: 40
        examples: [SBX482910377]
    Page:
      name: page
      in: query
      required: false
      description: Zero based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, 1 to 100.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RateLimitLimit:
      description: The merchant's request budget per minute.
      schema:
        type: integer
        examples: [60]
    RateLimitRemaining:
      description: Requests left in the current budget after this one.
      schema:
        type: integer
        minimum: 0
        examples: [59]
    RetryAfter:
      description: Seconds to wait before repeating the request.
      schema:
        type: integer
        minimum: 0
        examples: [1]
    CorrelationId:
      description: The correlation id of the request, yours or a generated UUID.
      schema:
        type: string
        examples: [b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d]
    Location:
      description: Address of the new order, `/api/v1/merchant-api/orders/{trackingNo}`.
      schema:
        type: string
        examples: [/api/v1/merchant-api/orders/SBX482910377]
    IdempotentReplayed:
      description: Always `true`. Present when the response is a replay of an earlier identical request.
      schema:
        type: string
        const: 'true'
  responses:
    BadRequest:
      description: |
        The request is invalid. `VALIDATION_FAILED` lists the offending fields in `details` (also used for a bad
        `page`, `size`, `status` or `Idempotency-Key`). `MALFORMED_REQUEST` means the body is missing or is not
        valid JSON, or that both `X-API-Key` and `Authorization: Bearer` were sent.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validationFailed:
              summary: Field errors
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 400
                error: Bad Request
                code: VALIDATION_FAILED
                message: Validation failed
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
                details:
                  - field: dropoff.city
                    message: must not be blank
                  - field: parcel.weightKg
                    message: must be greater than or equal to 0.01
            malformed:
              summary: Not JSON, or two credentials
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 400
                error: Bad Request
                code: MALFORMED_REQUEST
                message: Send either the X-API-Key header or an Authorization Bearer token, not both
                path: /api/v1/merchant-api/ping
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    Unauthorized:
      description: |
        No credential was sent (`UNAUTHENTICATED`), or the credential is not acceptable: `INVALID_API_KEY` for an
        API key, `INVALID_TOKEN` for an access token (then with `WWW-Authenticate: Bearer error="invalid_token"`).
        The cause (malformed, unknown, revoked, expired, wrong secret) is deliberately not revealed.
      headers:
        WWW-Authenticate:
          description: '`Bearer` or `Bearer error="invalid_token"`; absent for a rejected API key.'
          schema:
            type: string
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalidApiKey:
              summary: Bad API key
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 401
                error: Unauthorized
                code: INVALID_API_KEY
                message: The API key is invalid, expired or revoked
                path: /api/v1/merchant-api/ping
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
            invalidToken:
              summary: Bad or expired access token
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 401
                error: Unauthorized
                code: INVALID_TOKEN
                message: The access token is invalid, expired or revoked
                path: /api/v1/merchant-api/ping
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
            noCredential:
              summary: No credential
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 401
                error: Unauthorized
                code: UNAUTHENTICATED
                message: Authentication is required
                path: /api/v1/merchant-api/ping
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    Forbidden:
      description: |
        The credential is valid but the call is not allowed:

        * `MERCHANT_NOT_APPROVED`: the merchant is pending, rejected or suspended. Applies to every call, even
          with a valid key. Does not count against the rate limit and carries no rate limit headers.
        * `FORBIDDEN`: the credential lacks the scope the endpoint needs (`orders:read` or `orders:write`).
        * `SANDBOX_ONLY`: the sandbox advance endpoint was called with a LIVE credential.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notApproved:
              summary: Merchant not approved
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 403
                error: Forbidden
                code: MERCHANT_NOT_APPROVED
                message: Your merchant account is not approved for API access
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
            missingScope:
              summary: Token without the needed scope
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 403
                error: Forbidden
                code: FORBIDDEN
                message: You do not have permission to perform this action
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
            sandboxOnly:
              summary: LIVE credential on a sandbox endpoint
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 403
                error: Forbidden
                code: SANDBOX_ONLY
                message: Orders can only be advanced with a TEST credential
                path: /api/v1/merchant-api/sandbox/orders/SBX482910377/advance
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    NotFound:
      description: |
        No such order for this merchant in the environment of the credential. A tracking number of another
        merchant, or of the other environment, gives the same answer.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            orderNotFound:
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 404
                error: Not Found
                code: NOT_FOUND
                message: Order not found
                path: /api/v1/merchant-api/orders/SD99999999
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    UnsupportedMediaType:
      description: The request body has a content type the endpoint does not accept (`application/json` is expected).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            wrongContentType:
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 415
                error: Unsupported Media Type
                code: UNSUPPORTED_MEDIA_TYPE
                message: This content type is not supported
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    TooManyRequests:
      description: The merchant's request budget is used up. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rateLimited:
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 429
                error: Too Many Requests
                code: RATE_LIMITED
                message: Rate limit of 60 requests per minute exceeded. Retry in 1 seconds
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    InternalError:
      description: Unexpected failure. The message is generic; quote the `correlationId` to support.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internalError:
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 500
                error: Internal Server Error
                code: INTERNAL_ERROR
                message: An unexpected error occurred. Please quote the correlation id when contacting support
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
    ServiceUnavailable:
      description: |
        The SwiftDrop parcel service could not be reached or answered with an error (LIVE credentials only). No
        order was created; repeat the request with the same `Idempotency-Key` after a short wait.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            parcelServiceDown:
              value:
                timestamp: '2026-11-01T08:30:12.123Z'
                status: 503
                error: Service Unavailable
                code: PARCEL_SERVICE_UNAVAILABLE
                message: The parcel service is unavailable. Please try again shortly
                path: /api/v1/merchant-api/orders
                correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
  schemas:
    ApiError:
      type: object
      description: Error body of every endpoint except `/oauth/token`.
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error was produced (UTC).
        status:
          type: integer
          description: The HTTP status code.
          examples: [422]
        error:
          type: string
          description: The HTTP reason phrase.
          examples: [Unprocessable Entity]
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human readable and safe to show to end users. Never contains stack traces or personal data. May change; do not parse it.
        path:
          type: string
          description: The request path.
        correlationId:
          type: [string, 'null']
          description: The correlation id of the request.
        details:
          type: array
          description: Field level problems; only present for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The offending field, for example `dropoff.city`.
          examples: [dropoff.city]
        message:
          type: string
          examples: [must not be blank]
    ErrorCode:
      type: string
      description: Stable machine readable error code. Each code is tied to one HTTP status.
      enum:
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - UNAUTHENTICATED
        - INVALID_API_KEY
        - INVALID_TOKEN
        - FORBIDDEN
        - MERCHANT_NOT_APPROVED
        - SANDBOX_ONLY
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - DUPLICATE_EXTERNAL_REF
        - IDEMPOTENCY_KEY_IN_USE
        - INVALID_STATE
        - OPTIMISTIC_LOCK
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IDEMPOTENCY_KEY_REUSED
        - PARCEL_REJECTED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PARCEL_SERVICE_UNAVAILABLE
      examples: [VALIDATION_FAILED]
    Ping:
      type: object
      required: [merchantId, businessName, environment, scopes]
      properties:
        merchantId:
          type: string
          format: uuid
          description: The merchant the credential belongs to.
        businessName:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        scopes:
          type: array
          description: Scopes of the credential, in the order `orders:write`, `orders:read`.
          items:
            $ref: '#/components/schemas/Scope'
    Environment:
      type: string
      description: '`LIVE` creates real parcels; `TEST` works in sandbox mode.'
      enum: [LIVE, TEST]
    Scope:
      type: string
      enum: [orders:write, orders:read]
    CreateOrderRequest:
      type: object
      description: |
        A delivery order. Text values are trimmed, blank optional values count as absent and control characters
        (line breaks, NUL, escape sequences) are rejected. Unknown fields are ignored.
      required: [recipient, pickup, dropoff, parcel]
      properties:
        externalRef:
          type: string
          description: Your own order number. Unique per merchant (`409 DUPLICATE_EXTERNAL_REF` otherwise).
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:/#-]+$'
          examples: [ORDER-1001]
        recipient:
          $ref: '#/components/schemas/Recipient'
        pickup:
          $ref: '#/components/schemas/Address'
        dropoff:
          $ref: '#/components/schemas/Address'
        parcel:
          $ref: '#/components/schemas/Parcel'
        notes:
          type: string
          description: Free text for the courier.
          maxLength: 500
          examples: [Call on arrival]
    Recipient:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          description: Must not be blank.
          minLength: 1
          maxLength: 120
          examples: [Nimali Perera]
        phone:
          type: string
          description: |
            E.164 style number: optional `+` and 9 to 15 digits. Spaces, dashes and brackets are removed before
            the check, so `+94 (77) 123-4567` is accepted and returned as `+94771234567`.
          pattern: '^\+?[0-9]{9,15}$'
          examples: ['+94771234567']
    Address:
      type: object
      required: [addressLine, city]
      properties:
        addressLine:
          type: string
          description: Must not be blank.
          minLength: 1
          maxLength: 300
          examples: [12 Galle Rd]
        city:
          type: string
          description: Must not be blank.
          minLength: 1
          maxLength: 100
          examples: [Colombo]
        postalCode:
          type: [string, 'null']
          maxLength: 16
          examples: ['00300']
    Parcel:
      type: object
      required: [weightKg, size]
      properties:
        weightKg:
          type: number
          description: |
            Weight in kilograms, 0.01 to 50.00 with at most two decimals (`2.5` and `2.50` are the same parcel).
          minimum: 0.01
          maximum: 50.00
          multipleOf: 0.01
          examples: [2.5]
        size:
          $ref: '#/components/schemas/ParcelSize'
        description:
          type: [string, 'null']
          maxLength: 200
          examples: [Phone case]
    ParcelSize:
      type: string
      enum: [SMALL, MEDIUM, LARGE]
    Money:
      type: object
      description: An amount with two decimals and its ISO 4217 currency code.
      required: [amount, currency]
      properties:
        amount:
          type: number
          multipleOf: 0.01
          examples: [450.00]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [LKR]
    OrderStatus:
      type: string
      description: |
        Lifecycle of an order. `PENDING` is an internal placeholder that exists for a moment while the parcel is
        booked; it is never part of a successful create response.
      enum:
        - PENDING
        - CREATED
        - ASSIGNED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - FAILED
        - RESCHEDULED
        - RETURNED
        - CANCELLED
    OrderSource:
      type: string
      description: How the order reached SwiftDrop. Orders created through this API are `API`.
      enum: [API, PORTAL, BULK]
    Order:
      type: object
      description: An order as the merchant sees it.
      required:
        - id
        - trackingNo
        - externalRef
        - status
        - sandbox
        - source
        - trackingUrl
        - recipient
        - pickup
        - dropoff
        - parcel
        - notes
        - fee
        - failureReason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        trackingNo:
          type: [string, 'null']
          description: '`SD...` for live orders, `SBX...` followed by nine digits for sandbox orders. Null only while the parcel is being booked.'
        externalRef:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrderStatus'
        sandbox:
          type: boolean
          description: True for orders created with a TEST credential.
        source:
          $ref: '#/components/schemas/OrderSource'
        trackingUrl:
          type: [string, 'null']
          format: uri
          description: Public tracking page of the parcel. Share it with the recipient.
        recipient:
          $ref: '#/components/schemas/Recipient'
        pickup:
          $ref: '#/components/schemas/Address'
        dropoff:
          $ref: '#/components/schemas/Address'
        parcel:
          $ref: '#/components/schemas/Parcel'
        notes:
          type: [string, 'null']
        fee:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Delivery fee. Null until the parcel is booked.
        failureReason:
          type: [string, 'null']
          description: Why the last delivery failed; set when the status is `FAILED`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      description: One page of orders.
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          description: Zero based page number.
        size:
          type: integer
          description: Requested page size.
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    AdvanceOrderRequest:
      type: object
      properties:
        outcome:
          type: string
          description: '`NEXT` takes the next step of the lifecycle (default); `FAILED` fails the order.'
          enum: [NEXT, FAILED]
          default: NEXT
        reason:
          type: [string, 'null']
          description: Failure reason; only used with `FAILED`.
          maxLength: 300
          examples: [Recipient not available]
    TokenRequest:
      type: object
      description: Form fields of the token request (`application/x-www-form-urlencoded`).
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        scope:
          type: string
          description: Space separated subset of the scopes of the client. Defaults to all of its scopes.
          examples: [orders:write orders:read]
        client_id:
          type: string
          description: The OAuth client id, `mc_` and 20 characters. Alternative to HTTP Basic authentication.
          examples: [mc_k3j9x0q2w8e4r6t7y1u5]
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: The client secret. Alternative to HTTP Basic authentication.
    TokenResponse:
      type: object
      description: Successful answer of the token endpoint (RFC 6749 section 5.1).
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: Signed JWT; opaque to clients.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Lifetime in seconds (3600 unless the operator changed it).
          examples: [3600]
        scope:
          type: string
          description: The granted scopes, space separated, in the order `orders:write orders:read`.
          examples: [orders:write orders:read]
    OAuthError:
      type: object
      description: Error body of the token endpoint (RFC 6749 section 5.2). Not an `ApiError`.
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
          description: Human readable explanation; do not parse it.
    WebhookEvent:
      type: object
      description: |
        The envelope of every webhook delivery. `eventId` is the idempotency key and equals the
        `X-SwiftDrop-Event-Id` header; `eventType` equals `X-SwiftDrop-Event-Type`. Fields may be added in
        future versions, never renamed or removed; ignore the ones you do not know.
      required: [eventId, eventType, version, occurredAt, producer, correlationId, aggregateId, data]
      properties:
        eventId:
          type: string
          description: Unique id of the event. The same value for every retry and replay.
          examples: [7c1e9a52-0f4b-4a52-9d3e-2b8f0f1c6a11]
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        version:
          type: integer
          description: Schema version of the envelope. Currently 1.
          const: 1
        occurredAt:
          type: string
          format: date-time
          description: When the change happened (UTC). Use it to ignore updates older than what you already have.
        producer:
          type: string
          description: The service that produced the event, for example `parcel-service`.
          examples: [parcel-service]
        correlationId:
          type: [string, 'null']
          description: The correlation id of the action that caused the event.
        aggregateId:
          type: string
          description: Id of the entity the event is about (the parcel).
          examples: [PCL-000123]
        data:
          type: object
          description: Event specific fields, see the individual events.
    WebhookEventType:
      type: string
      enum:
        - parcel.created
        - parcel.status.picked_up
        - parcel.status.in_transit
        - parcel.status.out_for_delivery
        - parcel.status.delivered
        - parcel.status.failed
        - parcel.status.rescheduled
        - parcel.status.returned
        - parcel.cancelled
        - webhook.test
    ParcelEventData:
      type: object
      description: |
        `data` of the `parcel.*` events. Only the identifiers `merchantId`, `parcelId` and `trackingNo` are
        always present; the other fields depend on the event type and may be absent.
      required: [merchantId, parcelId, trackingNo]
      properties:
        merchantId:
          type: string
          description: Your merchant id (the `merchantId` of `GET /merchant-api/ping`).
        parcelId:
          type: string
          examples: [PCL-000123]
        trackingNo:
          type: string
          description: Tracking number of the order; use it with `GET /merchant-api/orders/{trackingNo}`.
          examples: [SD24000123]
        fromStatus:
          type: string
          description: Status before the change (`parcel.status.*`).
          examples: [IN_TRANSIT]
        toStatus:
          type: string
          description: Status after the change (`parcel.status.*`).
          examples: [OUT_FOR_DELIVERY]
        etaMinutes:
          type: integer
          description: Estimated minutes until delivery (`parcel.status.out_for_delivery`).
        recipientName:
          type: string
          description: Who received the parcel (`parcel.status.delivered`).
        proofUrl:
          type: string
          description: Link to the proof of delivery (`parcel.status.delivered`).
        failureReason:
          type: string
          description: Why the delivery failed (`parcel.status.failed`).
        attemptNo:
          type: integer
          description: Number of the delivery attempt (`parcel.status.failed`).
        newDate:
          type: string
          description: New delivery date (`parcel.status.rescheduled`).
        returnReason:
          type: string
          description: Why the parcel comes back (`parcel.status.returned`).
        cancelledBy:
          type: string
          description: Who cancelled (`parcel.cancelled`).
        reason:
          type: string
          description: Cancellation reason (`parcel.cancelled`).
        fee:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Delivery fee (`parcel.created`).
    WebhookTestData:
      type: object
      required: [merchantId]
      properties:
        merchantId:
          type: string
          description: Your merchant id.
    WebhookParcelEvent:
      description: A `parcel.*` event.
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParcelEventData'
    WebhookTestEvent:
      type: object
      description: |
        The `webhook.test` event sent when you press *Send test* in the portal. It has the envelope of the other
        events, but no `aggregateId` and no `correlationId`.
      required: [eventId, eventType, version, occurredAt, producer, data]
      properties:
        eventId:
          type: string
          examples: [2f6e0c8a-1b3d-4e5f-9a7b-8c6d4e2f0a1b]
        eventType:
          type: string
          const: webhook.test
        version:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          const: merchant-service
        data:
          $ref: '#/components/schemas/WebhookTestData'
webhooks:
  parcelEvent:
    post:
      tags: [Webhooks]
      operationId: receiveParcelEvent
      summary: Parcel created, status changed or cancelled
      description: |
        Sent to your webhook URL for `parcel.created`, `parcel.status.*` and `parcel.cancelled`, according to the
        event selection of your webhook. See the *Webhooks* section above for the signature, the retry schedule
        and the ordering rules.

        Answer with any `2xx` within 5 seconds. Your endpoint must be reachable over HTTPS from the internet.
      security: []
      parameters:
        - name: X-SwiftDrop-Event-Id
          in: header
          required: true
          description: Unique id of the event; identical for every retry and replay.
          schema:
            type: string
            examples: [7c1e9a52-0f4b-4a52-9d3e-2b8f0f1c6a11]
        - name: X-SwiftDrop-Event-Type
          in: header
          required: true
          description: The event type.
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: X-SwiftDrop-Timestamp
          in: header
          required: true
          description: Unix time in seconds at which this attempt was signed. Reject values more than 5 minutes from your clock.
          schema:
            type: string
            pattern: '^[0-9]+$'
            examples: ['1793521812']
        - name: X-SwiftDrop-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of `timestamp + "." + body`, keyed with your webhook secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
            examples: ['9f2c1a7e5b3d8046f1e2a9c7b5d3f1e08a6c4e2b0d9f7a5c3e1b8d6f4a2c0e9b']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookParcelEvent'
            examples:
              outForDelivery:
                summary: parcel.status.out_for_delivery
                value:
                  eventId: 7c1e9a52-0f4b-4a52-9d3e-2b8f0f1c6a11
                  eventType: parcel.status.out_for_delivery
                  version: 1
                  occurredAt: '2026-11-01T08:30:12Z'
                  producer: parcel-service
                  correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
                  aggregateId: PCL-000123
                  data:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    parcelId: PCL-000123
                    trackingNo: SD24000123
                    fromStatus: IN_TRANSIT
                    toStatus: OUT_FOR_DELIVERY
                    etaMinutes: 45
              failed:
                summary: parcel.status.failed
                value:
                  eventId: 3d9b5f1a-6c2e-4b78-a0d4-9e8f7a6b5c43
                  eventType: parcel.status.failed
                  version: 1
                  occurredAt: '2026-11-01T11:05:40Z'
                  producer: parcel-service
                  correlationId: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                  aggregateId: PCL-000123
                  data:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    parcelId: PCL-000123
                    trackingNo: SD24000123
                    fromStatus: OUT_FOR_DELIVERY
                    toStatus: FAILED
                    failureReason: Recipient not available
                    attemptNo: 1
              created:
                summary: parcel.created
                value:
                  eventId: a5b4c3d2-e1f0-4a9b-8c7d-6e5f4a3b2c1d
                  eventType: parcel.created
                  version: 1
                  occurredAt: '2026-11-01T09:02:44Z'
                  producer: parcel-service
                  correlationId: 9a8b7c6d-5e4f-4321-8fed-cba987654321
                  aggregateId: PCL-000123
                  data:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    parcelId: PCL-000123
                    trackingNo: SD24000123
                    fee:
                      amount: 450.00
                      currency: LKR
              cancelled:
                summary: parcel.cancelled
                value:
                  eventId: 0b1c2d3e-4f50-4a61-b7c8-d9e0f1a2b3c4
                  eventType: parcel.cancelled
                  version: 1
                  occurredAt: '2026-11-01T09:20:00Z'
                  producer: parcel-service
                  correlationId: 5c4d3e2f-1a0b-4c9d-8e7f-6a5b4c3d2e1f
                  aggregateId: PCL-000123
                  data:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    parcelId: PCL-000123
                    trackingNo: SD24000123
                    cancelledBy: merchant
                    reason: Customer cancelled the order
      responses:
        2XX:
          description: |
            Delivered. Any `2xx` status within 5 seconds counts; the body is ignored. Also answer `2xx` for an
            event you have already processed.
        4XX:
          description: |
            Rejected. `429` is treated as temporary and retried; every other `4xx` answer (`400`, `401`,
            `404` ...) is treated as a configuration error and is **not** retried.
        5XX:
          description: Temporary failure. The delivery is retried on the schedule described in the *Webhooks* section.
  webhookTest:
    post:
      tags: [Webhooks]
      operationId: receiveWebhookTest
      summary: Test delivery
      description: |
        Sent once when you press *Send test* in the portal (`POST /merchants/me/webhook/test`). It is signed with
        your secret exactly like a real delivery, so you can check your verification code. The request times out
        after 5 seconds, redirects are not followed and your response body is discarded. The portal shows the
        HTTP status you answered.
      security: []
      parameters:
        - name: X-SwiftDrop-Event-Id
          in: header
          required: true
          description: Unique id of the test event.
          schema:
            type: string
            examples: [2f6e0c8a-1b3d-4e5f-9a7b-8c6d4e2f0a1b]
        - name: X-SwiftDrop-Event-Type
          in: header
          required: true
          description: Always `webhook.test`.
          schema:
            type: string
            const: webhook.test
        - name: X-SwiftDrop-Timestamp
          in: header
          required: true
          description: Unix time in seconds at which the test was signed.
          schema:
            type: string
            pattern: '^[0-9]+$'
            examples: ['1793521812']
        - name: X-SwiftDrop-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of `timestamp + "." + body`, keyed with your webhook secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
            examples: ['9f2c1a7e5b3d8046f1e2a9c7b5d3f1e08a6c4e2b0d9f7a5c3e1b8d6f4a2c0e9b']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestEvent'
            examples:
              test:
                summary: webhook.test
                value:
                  eventId: 2f6e0c8a-1b3d-4e5f-9a7b-8c6d4e2f0a1b
                  eventType: webhook.test
                  version: 1
                  occurredAt: '2026-11-01T08:30:12.123Z'
                  producer: merchant-service
                  data:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
      responses:
        2XX:
          description: The test was delivered. The portal shows the status you answered.
        4XX:
          description: Reported as failed in the portal. A test is never retried.
        5XX:
          description: Reported as failed in the portal. A test is never retried.
