openapi: 3.0.3
info:
  title: SwiftDrop Merchant API
  version: 0.1.0
  description: >
    Placeholder document. It currently describes only the credential test endpoint and the OAuth token
    endpoint; the order endpoints are added later.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /merchant-api/ping:
    get:
      summary: Test a credential
      description: Returns the merchant, environment and scopes of the API key or access token used.
      operationId: ping
      responses:
        '200':
          description: The credential is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
        '401':
          description: The API key or access token is invalid, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The merchant account is not approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The rate limit of the merchant is exhausted.
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/token:
    post:
      summary: Get an access token (OAuth 2.0 client credentials)
      operationId: createToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                scope:
                  type: string
                  description: Space separated subset of the scopes of the client.
                  example: orders:read orders:write
                client_id:
                  type: string
                  description: Alternative to HTTP Basic authentication.
                client_secret:
                  type: string
                  format: password
                  description: Alternative to HTTP Basic authentication.
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid request, unsupported grant type or invalid scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Ping:
      type: object
      properties:
        merchantId:
          type: string
          format: uuid
        businessName:
          type: string
        environment:
          type: string
          enum:
            - LIVE
            - TEST
        scopes:
          type: array
          items:
            type: string
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
