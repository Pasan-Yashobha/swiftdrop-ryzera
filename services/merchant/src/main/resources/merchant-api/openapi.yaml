                      addressLine: 12 Galle Rd
                      city: Colombo
                      postalCode: '00300'
                    dropoff:
                      addressLine: 45 Temple St
                      city: Kandy
                      postalCode: '20000'
                    parcel:
                      weightKg: 2.50
                      size: SMALL
