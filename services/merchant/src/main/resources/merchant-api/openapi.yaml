openapi: 3.1.0
info:
  title: SwiftDrop Merchant API
  version: 1.0.0
  summary: Create and track SwiftDrop courier orders from your own systems.
  description: |
    The SwiftDrop Merchant API lets an approved merchant create delivery orders, look them up and follow their
    status from a backend system, and receive signed webhooks when a parcel moves. This document describes
    exactly what the Merchant Service implements. It is served, without authentication, at
    `GET /api/v1/merchant-api/openapi.yaml`.

    ## Quick start

    1. Register your business in the Merchant Portal and wait for an administrator to approve it.
       Until the merchant is `APPROVED`, every call with a credential is answered `403 MERCHANT_NOT_APPROVED`.
    2. In the portal open *Developers, API keys* and create a **TEST** key. The full key (`sd_test_...`) is
       shown **once**; store it in a secret manager.
    3. Check the key:

       ```bash
       curl -s https://api.example.com/api/v1/merchant-api/ping -H "X-API-Key: $SWIFTDROP_API_KEY"
       ```
    4. Create a sandbox order, then move it along with the sandbox advance endpoint:

       ```bash
       curl -s -X POST https://api.example.com/api/v1/merchant-api/orders \
         -H "X-API-Key: $SWIFTDROP_API_KEY" -H "Content-Type: application/json" \
         -H "Idempotency-Key: order-1001-attempt-1" \
         -d '{"externalRef":"ORDER-1001",
              "recipient":{"name":"Nimali Perera","phone":"+94771234567"},
              "pickup":{"addressLine":"12 Galle Rd","city":"Colombo","postalCode":"00300"},
              "dropoff":{"addressLine":"45 Temple St","city":"Kandy","postalCode":"20000"},
              "parcel":{"weightKg":2.5,"size":"SMALL","description":"Phone case"}}'
       ```
    5. When the integration works, create a **LIVE** key and switch the key in your configuration.

    Replace `https://api.example.com` with the address of your SwiftDrop gateway. Every path in this document is
    relative to the server URL `/api/v1`.

    ## Authentication

    Send **one** of the following on every `/merchant-api` request. Sending both an `X-API-Key` header and an
    `Authorization: Bearer` header is ambiguous and is answered `400 MALFORMED_REQUEST`.

    | Method | How | Scopes |
    |---|---|---|
    | API key | `X-API-Key: sd_live_ab12cd34_...` | always `orders:read` and `orders:write` |
    | OAuth 2.0 client credentials | `Authorization: Bearer <access_token>` from `POST /oauth/token` | the scopes granted to the token |

    **API keys** have the form `sd_<live|test>_<8 characters>_<43 characters>` (60 characters in total). The
    first 16 characters (for example `sd_live_ab12cd34`) are a public prefix that the portal shows to identify the
    key; the rest is secret. Keys are stored only as a SHA-256 hash, so a lost key cannot be recovered, only
    replaced. Rotating a key
    creates a new one and lets the old one work for a grace period (default 24 hours, 0 to 72).

    **OAuth clients** (`client_id` `mc_...` and a 43 character secret, also shown once) exchange their
    credentials for a one hour bearer token (`expires_in` tells the exact lifetime). The token is only valid for
    this API. It stops working immediately when the client is revoked or the merchant is suspended.

    Every request re-checks the credential and the merchant. A revoked, expired or unknown credential is answered
    `401` with the same message whatever the reason, so the API does not reveal which keys exist.

    ## Sandbox

    A **TEST** credential (API key `sd_test_...` or an OAuth client created with the TEST environment) puts every
    request in sandbox mode:

    * Orders are created without calling the courier network. Their tracking number starts with `SBX` followed by
      nine digits, the fee is `350.00 + 100.00 x weightKg` LKR, the order is `CREATED` and `sandbox` is `true`.
    * A TEST credential only ever sees and creates sandbox orders. A LIVE credential never sees sandbox orders.
      Looking up a sandbox order with a LIVE credential (or the other way round) is a `404`.
    * You drive the lifecycle yourself with `POST /merchant-api/sandbox/orders/{trackingNo}/advance`:
      `CREATED`, `ASSIGNED`, `PICKED_UP`, `IN_TRANSIT`, `OUT_FOR_DELIVERY`, `DELIVERED`, one step per call, or
      `FAILED` at any step. `DELIVERED` and `FAILED` are final.
    * Sandbox orders publish **no events and send no webhooks**. Use `POST /merchants/me/webhook/test` in the
      portal to see a signed test delivery.
    * LIVE credentials cannot call the advance endpoint (`403 SANDBOX_ONLY`).

    ## Idempotency

    Send an `Idempotency-Key` header (up to 100 characters, unique per order you intend to create) on
    `POST /merchant-api/orders`. Keys are scoped to your merchant account and remembered for as long as the
    order exists.

    * Same key and same request: no new order. You get the stored order with `200` and
      `Idempotent-Replayed: true`. The first request answered `201`.
    * Same key and a **different** request: `422 IDEMPOTENCY_KEY_REUSED`.
    * Same key while the first request is still being processed: `409 IDEMPOTENCY_KEY_IN_USE` with
      `Retry-After: 1`. Wait and send the identical request again.
    * A failed booking (`422 PARCEL_REJECTED`, `503 PARCEL_SERVICE_UNAVAILABLE`) leaves no order behind, so the
      same key may be used to retry.

    `externalRef` (your own order number) is also unique per merchant: a second order with the same
    `externalRef` and no key, or a different key, is `409 DUPLICATE_EXTERNAL_REF`. Requests are compared on their content
    (trimmed text, weight with two decimals), not on their byte representation.

    ## Rate limits

    Each merchant has a request budget per minute (60 by default, set by SwiftDrop administrators). It is a token
    bucket that refills continuously, shared by all keys and tokens of the merchant, and applies to every
    `/merchant-api` request (not to `/oauth/token`). Every response to an authenticated request carries
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`. When the bucket is empty the answer is
    `429 RATE_LIMITED` with `Retry-After` (seconds).

    ## Errors

    All endpoints except `/oauth/token` answer errors with the JSON object described by the `ApiError` schema.
    Use `code` (stable, machine readable) rather than `message` (human readable, may change) in your logic.
    Validation errors list the offending fields in `details`. Unexpected failures return `500 INTERNAL_ERROR`
    with a generic message; quote the `correlationId` when you contact support. The token endpoint uses the
    error format of RFC 6749 section 5.2 instead.

    ## Correlation ids

    Send `X-Correlation-Id` (1 to 64 characters of `A-Z a-z 0-9 . _ : -`) to tag a request. Without one, or with
    an unacceptable value, the service generates a UUID. The id is echoed in the `X-Correlation-Id` response
    header and in error bodies, and is copied into the events the platform publishes about your order.

    ## Conventions

    * Timestamps are ISO 8601 in UTC with a `Z` suffix. Identifiers are UUIDs unless noted.
    * Money is a decimal number with two decimals and a currency code (`LKR`).
    * Optional values that are absent are returned as `null`, not omitted.
    * Lists are paged with `page` (from 0) and `size` (1 to 100, default 20) and are sorted by creation time,
      newest first.
    * Unknown request fields are ignored. New response fields may be added without a version change.

    ## Webhooks

    SwiftDrop can call a URL of yours when a parcel is created, changes status or is cancelled. Configure the URL,
    the event types and the signing secret in the portal. Delivery, signatures, retries and ordering are described
    in the `webhooks` section of this document.
  contact:
    name: SwiftDrop merchant integration support
  license:
    name: Proprietary
    identifier: LicenseRef-SwiftDrop-Proprietary
servers:
  - url: /api/v1
    description: Relative to the host that serves this document (the SwiftDrop gateway).
security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - OAuth2ClientCredentials: []
tags:
  - name: Merchant API
    description: Credential check and orders. Needs an API key or an access token.
  - name: Sandbox
    description: Helpers that only work with TEST credentials.
  - name: Authentication
    description: Access tokens for the OAuth 2.0 client credentials grant.
  - name: Documentation
    description: This document.
  - name: Webhooks
    description: |
      Signed event callbacks that SwiftDrop sends to the URL you configured in the portal. They are delivered by
      the SwiftDrop Webhook Delivery Service; the Merchant Service stores your URL, event selection and secret.

      ## Request

      Every delivery is an HTTPS `POST` with `Content-Type: application/json`. The body is the platform event
      envelope (see the `WebhookEvent` schema) and these headers:

      | Header | Meaning |
      |---|---|
      | `X-SwiftDrop-Event-Id` | Unique id of the event (same value as `eventId` in the body). Identical for every retry and replay. |
      | `X-SwiftDrop-Event-Type` | Event type, for example `parcel.status.delivered`. |
      | `X-SwiftDrop-Timestamp` | When this attempt was signed, Unix time in seconds. Changes on every attempt. |
      | `X-SwiftDrop-Signature` | Lowercase hex HMAC-SHA256 signature, see below. |

      ## Signature

      `signature = hex( HMAC_SHA256( key = secret, message = timestamp + "." + body ) )`

      * `secret` is your webhook secret, the complete string including the `whsec_` prefix, as UTF-8 bytes.
      * `timestamp` is the value of the `X-SwiftDrop-Timestamp` header, used exactly as received.
      * `body` is the raw request body, byte for byte. Verify before you parse the JSON; re-serialising a parsed
        document changes the bytes and breaks the signature.
      * `.` is a single full stop between the two parts.
      * The secret is shown once when you create the webhook and again when you rotate it. It is stored encrypted
        and cannot be read afterwards.

      Verification pseudocode:

      ```
      function verify(secret, headers, rawBody, now):
          timestamp = headers["X-SwiftDrop-Timestamp"]
          received  = headers["X-SwiftDrop-Signature"]
          if timestamp is not an integer:                       reject
          if abs(now - integer(timestamp)) > 300 seconds:       reject    // replay protection
          expected = hex(hmac_sha256(utf8(secret), utf8(timestamp + "." ) + rawBody))
          if not constant_time_equals(expected, received):      reject
          eventId = headers["X-SwiftDrop-Event-Id"]
          if eventId was already processed:                     return 200  // duplicate, do nothing
          process(parse_json(rawBody))
          remember(eventId)
          return 200
      ```

      Compare signatures in constant time (`hmac.compare_digest`, `crypto.timingSafeEqual`,
      `MessageDigest.isEqual`). Reject a timestamp more than 5 minutes (300 seconds) away from your clock.

      ## Delivery and retries

      * A delivery succeeded when your endpoint answers with **any 2xx status within 5 seconds**. Answer quickly
        and do the real work asynchronously.
      * Timeouts, connection errors, `5xx` and `429` are temporary and are retried. Other `4xx` answers
        (`400`, `401`, `404` ...) usually mean a configuration mistake and are **not** retried; the delivery is
        marked failed at once.
      * At most 6 attempts per event: immediately, then after 5 seconds, 30 seconds, 2 minutes, 10 minutes and
        30 minutes (about 43 minutes in total). After the last failure the delivery is marked failed and
        appears in the delivery log of the portal, where SwiftDrop staff can replay it once your endpoint works.
      * A replay carries the **same event id** with a new timestamp and signature.
      * Redirects are not a success. Do not answer with `3xx`.

      ## Ordering and duplicates

      Delivery is at least once and not ordered. A retried `parcel.status.out_for_delivery` can arrive after
      `parcel.status.delivered`.

      * Keep the `X-SwiftDrop-Event-Id` values you have processed and ignore repeats.
      * Compare `occurredAt` of an event with the value you stored for that parcel and ignore an update that is
        older than the state you already have.

      ## Event types

      Choose the events per webhook in the portal, or `*` for all of them. Sandbox orders never produce events.

      | Event type | Sent when |
      |---|---|
      | `parcel.created` | A parcel was booked for your order. |
      | `parcel.status.picked_up` | The courier collected the parcel. |
      | `parcel.status.in_transit` | The parcel is on its way between hubs. |
      | `parcel.status.out_for_delivery` | The parcel is out for delivery. |
      | `parcel.status.delivered` | The parcel was delivered. |
      | `parcel.status.failed` | A delivery attempt failed (`data.failureReason`). |
      | `parcel.status.rescheduled` | Delivery was rescheduled. |
      | `parcel.status.returned` | The parcel is being returned to you. |
      | `parcel.cancelled` | The parcel was cancelled. |
      | `webhook.test` | You pressed *Send test* in the portal. Always sent when asked, regardless of your selection. |

      Webhook payloads carry identifiers and status information, not contact details. Look the order up with
      `GET /merchant-api/orders/{trackingNo}` if you need the full record.
paths:
  /merchant-api/ping:
    get:
      tags: [Merchant API]
      operationId: ping
      summary: Test a credential
      description: |
        Returns the merchant, environment and scopes of the API key or access token that was used. Needs any valid
        credential, no particular scope. Use it to check that a key or token works and which environment (LIVE
        or TEST) it belongs to.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - OAuth2ClientCredentials: []
      responses:
        '200':
          description: The credential is valid.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
              examples:
                apiKey:
                  summary: An API key (always both scopes)
                  value:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    businessName: Lanka Crafts
                    environment: TEST
                    scopes: [orders:write, orders:read]
                readOnlyToken:
                  summary: An access token granted orders:read only
                  value:
                    merchantId: 6f0d6c3e-8b3a-4c1e-9d65-0c4f3a2b7e10
                    businessName: Lanka Crafts
                    environment: LIVE
                    scopes: [orders:read]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /merchant-api/orders:
    post:
      tags: [Merchant API]
      operationId: createOrder
      summary: Create an order
      description: |
        Books a parcel for the merchant. Needs the `orders:write` scope (API keys always have it).

        With a LIVE credential the parcel is booked with the SwiftDrop parcel service and gets a real tracking
        number and fee. With a TEST credential nothing leaves the Merchant Service: a sandbox order with an `SBX`
        tracking number is created, see *Sandbox* in the overview.

        Send an `Idempotency-Key` to make retries safe (see *Idempotency* in the overview). A new order is
        answered `201` with a `Location` header; a repeat of an earlier identical request is answered `200` with
        `Idempotent-Replayed: true` and the stored order.

        The merchant must be `APPROVED` at the moment of the call.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - OAuth2ClientCredentials: [orders:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              minimal:
                summary: Required fields only
                value:
                  recipient:
                    name: Nimali Perera
                    phone: '+94771234567'
                  pickup:
                    addressLine: 12 Galle Rd
                    city: Colombo
                  dropoff:
                    addressLine: 45 Temple St
                    city: Kandy
                  parcel:
                    weightKg: 1.2
                    size: SMALL
              full:
                summary: All fields
                value:
                  externalRef: ORDER-1001
                  recipient:
                    name: Nimali Perera
                    phone: '+94771234567'
                  pickup:
                    addressLine: 12 Galle Rd
                    city: Colombo
                    postalCode: '00300'
                  dropoff:
                    addressLine: 45 Temple St
                    city: Kandy
                    postalCode: '20000'
                  parcel:
                    weightKg: 2.5
                    size: SMALL
                    description: Phone case
                  notes: Call on arrival
      responses:
        '201':
          description: The order was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                sandbox:
                  summary: Sandbox order (TEST credential)
                  value:
                    id: 0f8b7c1e-5d0a-4a52-9d3e-2b8f0f1c6a11
                    trackingNo: SBX482910377
                    externalRef: ORDER-1001
                    status: CREATED
                    sandbox: true
                    source: API
                    trackingUrl: https://swiftdrop.example/track/SBX482910377
                    recipient:
                      name: Nimali Perera
                      phone: '+94771234567'
                    pickup:
                      addressLine: 12 Galle Rd
                      city: Colombo
                      postalCode: '00300'
                    dropoff:
                      addressLine: 45 Temple St
                      city: Kandy
                      postalCode: '20000'
                    parcel:
                      weightKg: 2.50
                      size: SMALL
                      description: Phone case
                    notes: Call on arrival
                    fee:
                      amount: 600.00
                      currency: LKR
                    failureReason: null
                    createdAt: '2026-11-01T08:30:12.123Z'
                    updatedAt: '2026-11-01T08:30:12.123Z'
                live:
                  summary: Live order (LIVE credential)
                  value:
                    id: 5a1d2c34-7b6e-4f90-8a12-3c4d5e6f7a80
                    trackingNo: SD24000123
                    externalRef: ORDER-1002
                    status: CREATED
                    sandbox: false
                    source: API
                    trackingUrl: https://swiftdrop.example/track/SD24000123
                    recipient:
                      name: Kamal Silva
                      phone: '+94712345678'
                    pickup:
                      addressLine: 12 Galle Rd
                      city: Colombo
                      postalCode: null
                    dropoff:
                      addressLine: 7 Lake Rd
                      city: Galle
                      postalCode: null
                    parcel:
                      weightKg: 1.20
                      size: SMALL
                      description: null
                    notes: null
                    fee:
                      amount: 450.00
                      currency: LKR
                    failureReason: null
                    createdAt: '2026-11-01T09:02:44.512Z'
                    updatedAt: '2026-11-01T09:02:44.512Z'
        '200':
          description: |
            The request repeated an earlier request with the same `Idempotency-Key` and identical content. The
            stored order is returned and no new order was created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                replay:
                  summary: Replay of the sandbox order above
                  value:
                    id: 0f8b7c1e-5d0a-4a52-9d3e-2b8f0f1c6a11
                    trackingNo: SBX482910377
                    externalRef: ORDER-1001
                    status: CREATED
                    sandbox: true
                    source: API
                    trackingUrl: https://swiftdrop.example/track/SBX482910377
                    recipient:
                      name: Nimali Perera
                      phone: '+94771234567'
                    pickup:
                      addressLine: 12 Galle Rd
                      city: Colombo
                      postalCode: '00300'
                    dropoff:
                      addressLine: 45 Temple St
                      city: Kandy
                      postalCode: '20000'
                    parcel:
                      weightKg: 2.50
                      size: SMALL
                      description: Phone case
                    notes: Call on arrival
                    fee:
                      amount: 600.00
                      currency: LKR
                    failureReason: null
                    createdAt: '2026-11-01T08:30:12.123Z'
                    updatedAt: '2026-11-01T08:30:12.123Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The order conflicts with an existing one:

            * `DUPLICATE_EXTERNAL_REF`: another order of the merchant already uses this `externalRef`.
            * `IDEMPOTENCY_KEY_IN_USE`: the first request with this key is still being processed. Sent with
              `Retry-After: 1`; repeat the identical request.
            * `INVALID_STATE`: the order could not be reserved because of repeated concurrent conflicts; retry.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicateExternalRef:
                  summary: externalRef already used
                  value:
                    timestamp: '2026-11-01T08:31:02.004Z'
                    status: 409
                    error: Conflict
                    code: DUPLICATE_EXTERNAL_REF
                    message: Another order of this merchant already uses this externalRef
                    path: /api/v1/merchant-api/orders
                    correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
                idempotencyKeyInUse:
                  summary: First request still in flight
                  value:
                    timestamp: '2026-11-01T08:31:02.004Z'
                    status: 409
                    error: Conflict
                    code: IDEMPOTENCY_KEY_IN_USE
                    message: A request with this Idempotency-Key is still being processed
                    path: /api/v1/merchant-api/orders
                    correlationId: b41d0c2e-3f6a-4d1b-9c55-7a1e2f3b4c5d
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: |
            The request is well formed but cannot be executed:

            * `IDEMPOTENCY_KEY_REUSED`: this `Idempotency-Key` was already used with a different request.
            * `PARCEL_REJECTED`: the parcel service refused the order (LIVE credentials only). No order was
              created and the key can be used again.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                keyReused:
                  summary: Same key, different content
                  value:
                    timestamp: '2026-11-01T08:32:40.771Z'
                    status: 422
                    error: Unprocessable Entity
                    code: IDEMPOTENCY_KEY_REUSED
                    message: This Idempotency-Key was already used with a different request
                    path: /api/v1/merchant-api/orders
                    correlationId: 0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
                parcelRejected:
                  summary: Refused by the parcel service
                  value:
                    timestamp: '2026-11-01T08:33:10.025Z'
                    status: 422
                    error: Unprocessable Entity
                    code: PARCEL_REJECTED
                    message: Pickup city is outside the service area
                    path: /api/v1/merchant-api/orders
                    correlationId: 0c9d8e7f-6a5b-4c3d-8e2f-1a0b9c8d7e6f
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Merchant API]
      operationId: listOrders
      summary: List orders
      description: |
        Lists the merchant's orders of the environment of the credential: sandbox orders for a TEST credential,
        live orders for a LIVE credential. Newest first. Needs the `orders:read` scope.

        Internal placeholder orders (`PENDING`) are hidden unless you filter on `status=PENDING`.
      parameters:
        - name: externalRef
          in: query
          required: false
          description: Only the order with exactly this `externalRef`.
          schema:
            type: string
            examples: [ORDER-1001]
        - name: status
          in: query
          required: false
          description: Only orders in this status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - OAuth2ClientCredentials: [orders:read]
      responses:
        '200':
          description: One page of orders.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                onePage:
                  summary: A page with one sandbox order
                  value:
                    content:
