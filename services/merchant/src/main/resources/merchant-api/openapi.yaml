  /merchant-api/sandbox/orders/{trackingNo}/advance:
    post:
      tags: [Sandbox]
      operationId: advanceSandboxOrder
      summary: Advance a sandbox order
      description: |
        Moves a sandbox order to its next delivery step, or fails it, standing in for the couriers. Needs the
        `orders:write` scope **and** a TEST credential (`403 SANDBOX_ONLY` otherwise).

        Without a body, or with `outcome` `NEXT`, the order takes one step along
        `CREATED`, `ASSIGNED`, `PICKED_UP`, `IN_TRANSIT`, `OUT_FOR_DELIVERY`, `DELIVERED`. With `outcome`
        `FAILED` it moves to `FAILED` immediately and `reason` becomes its `failureReason` (default
        `Delivery failed (sandbox)`). `DELIVERED` and `FAILED` are final: advancing them is
        `409 INVALID_STATE`.

        Nothing is published and no webhook is sent for sandbox orders.
      parameters:
        - $ref: '#/components/parameters/TrackingNo'
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
        - OAuth2ClientCredentials: [orders:write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceOrderRequest'
            examples:
              next:
                summary: Take the next step (same as sending no body)
                value:
                  outcome: NEXT
              fail:
                summary: Fail the delivery
                value:
                  outcome: FAILED
                  reason: Recipient not available
      responses:
        '200':
          description: The order after the step.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                assigned:
                  summary: CREATED to ASSIGNED
                  value:
                    id: 0f8b7c1e-5d0a-4a52-9d3e-2b8f0f1c6a11
                    trackingNo: SBX482910377
                    externalRef: ORDER-1001
                    status: ASSIGNED
                    sandbox: true
                    source: API
                    trackingUrl: https://swiftdrop.example/track/SBX482910377
                    recipient:
