spring:
  application:
    name: reporting-service-test
  datasource:
    url: jdbc:h2:mem:reporting_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

reporting:
  timezone: Asia/Colombo
  queues:
    main: reporting.q
    dlq: reporting.dlq
  exchanges:
    events: swiftdrop.events
    dlx: swiftdrop.dlx

# Disable nightly scheduler firing automatically during test runs
reporting.reconciliation.cron: "0 0 1 1 1 ?"
