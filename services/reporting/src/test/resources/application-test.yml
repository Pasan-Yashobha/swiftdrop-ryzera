spring:
  application:
    name: reporting-service-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

reporting:
  timezone: Asia/Colombo
  queues:
    main: reporting.q
    dlq: reporting.dlq
  exchanges:
    events: swiftdrop.events
    dlx: swiftdrop.dlx

# Disable nightly scheduler firing automatically during test runs
reporting.reconciliation.cron: "0 0 1 1 1 ?"
