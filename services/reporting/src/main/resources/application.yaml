spring:
  application:
    name: reporting-service

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reporting_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:swiftdrop}
    password: ${RABBITMQ_PASSWORD:dev_rabbit_pw}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false   # manual retry in code, not Spring retry

  # ── Security / OAuth2 Resource Server ────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

# ── Reporting-service custom properties ───────────────────────────────────
reporting:
  timezone: ${REPORTING_TIMEZONE:Asia/Colombo}
  queues:
    main: reporting.q
    dlq: reporting.dlq
  exchanges:
    events: swiftdrop.events
    dlx: swiftdrop.dlx
  bindings:
    - parcel.#
    - courier.availability.changed

# ── Actuator / Observability ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{40} - %msg%n"
  level:
    com.swiftdrop.reporting: INFO
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8084}
