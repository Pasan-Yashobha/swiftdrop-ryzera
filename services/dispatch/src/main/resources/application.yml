# SwiftDrop Dispatch Service configuration.
# No secrets live here: every secret comes from an environment variable.
# Local development defaults are in application-dev.yml (profile "dev").

spring:
  application:
    name: dispatch-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

swiftdrop:
  dispatch:
    max-active-per-courier: ${DISPATCH_MAX_ACTIVE_PER_COURIER:8}
    zone-cache-ttl-minutes: 10
    idempotency-ttl-hours: 24
  integration:
    parcel-service-url: ${PARCEL_SERVICE_URL:http://parcel:8080}
    pricing-service-url: ${PRICING_SERVICE_URL:http://pricing:8080}
  security:
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
