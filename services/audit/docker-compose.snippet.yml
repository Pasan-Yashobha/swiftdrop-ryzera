# Paste this block into the root docker-compose.yml under "services:" (next to identity, merchant and gateway).
# Then: docker compose up -d --build audit
  audit:
    build:
      context: ./services/audit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: audit_svc
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_DB_PASSWORD:-dev_service_pw}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-swiftdrop}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev_rabbit_pw}
      IDENTITY_JWKS_URI: http://identity:8080/.well-known/jwks.json
      JWT_ISSUER: swiftdrop-identity
    ports:
      - "8091:8080"
    networks: [ swiftdrop ]
