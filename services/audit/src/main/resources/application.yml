server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: audit-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/audit_db}
    username: ${SPRING_DATASOURCE_USERNAME:audit_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_service_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:swiftdrop}
    password: ${SPRING_RABBITMQ_PASSWORD:dev_rabbit_pw}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Event envelopes from other services may grow new fields; ignore what we do not know.
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

swiftdrop:
  audit:
    security:
      identity-jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      jwt-issuer: ${JWT_ISSUER:swiftdrop-identity}
    # events: defaults are in AppProperties (queue audit.q, dead-letter queue audit.dlq, 3 attempts)
