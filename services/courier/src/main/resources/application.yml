# SwiftDrop Courier Service configuration.
# No secrets live here: every secret comes from an environment variable.
# Local development defaults are in application-dev.yml (profile "dev").

spring:
  application:
    name: courier-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

swiftdrop:
  courier:
    default-max-active: ${COURIER_DEFAULT_MAX_ACTIVE:8}
    gps-precision-decimals: 4
  integration:
    parcel-service-url: ${PARCEL_SERVICE_URL:http://parcel:8080}
    identity-service-url: ${IDENTITY_SERVICE_URL:http://identity:8080}
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
    allow-mock-fallback: ${ALLOW_MOCK_FALLBACK:false}
  security:
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    jwt-issuer: ${JWT_ISSUER:swiftdrop-identity}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/proofs}
    s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
    s3-bucket: ${S3_BUCKET:proof-photos}
    s3-region: ${S3_REGION:us-east-1}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
  messaging:
    exchange: ${SWIFTDROP_EVENTS_EXCHANGE:swiftdrop.events}
    dead-letter-exchange: ${SWIFTDROP_DLX_EXCHANGE:swiftdrop.dlx}
    queue: ${COURIER_ASSIGNMENTS_QUEUE:courier.assignments.q}
    dead-letter-queue: ${COURIER_ASSIGNMENTS_DLQ:courier.assignments.dlq}
    assigned-routing-key: parcel.assigned
    reassigned-routing-key: parcel.reassigned
