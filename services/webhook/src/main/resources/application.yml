# Webhook Delivery Service configuration.
# No secrets live here: every secret comes from an environment variable (see services/webhook/README.md).
# Local development defaults are in application-dev.yml (profile "dev").

spring:
  application:
    name: webhook-service
  # Datasource and broker settings are bound from SPRING_DATASOURCE_* and SPRING_RABBITMQ_*.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

swiftdrop:
  security:
    identity-jwks-uri: ${IDENTITY_JWKS_URI:}
    jwt-issuer: ${JWT_ISSUER:}
    dev-hmac-secret: ${DEV_JWT_HMAC_SECRET:}
    internal-token: ${INTERNAL_API_TOKEN:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  merchant:
    base-url: ${MERCHANT_SERVICE_URL:http://merchant:8080}
  delivery:
    # Delay before attempts 2..6 (5 s, 30 s, 2 min, 10 min, 30 min). Also the x-message-ttl of the delay queues.
    retry-delays-ms: ${WEBHOOK_RETRY_DELAYS_MS:5000,30000,120000,600000,1800000}
