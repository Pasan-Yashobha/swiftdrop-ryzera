# Local development defaults (profile "dev"). Never use these values outside a developer machine.
# Matches the Postgres (host port 5433) and RabbitMQ containers started by the root docker-compose.yml.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/webhook_db}
    username: ${SPRING_DATASOURCE_USERNAME:webhook_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_service_pw}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:swiftdrop}
    password: ${SPRING_RABBITMQ_PASSWORD:dev_rabbit_pw}

management:
  endpoint:
    health:
      show-details: always

swiftdrop:
  security:
    # No Identity service in local runs: use a token from the Merchant Service's POST /api/v1/dev/tokens (HS256).
    dev-hmac-secret: ${DEV_JWT_HMAC_SECRET:dev-only-hmac-secret-change-me-0123456789}
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  merchant:
    base-url: ${MERCHANT_SERVICE_URL:http://localhost:8083}
