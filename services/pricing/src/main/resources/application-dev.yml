# Matches the team's Docker Compose defaults. Use only for local development.
DEV_JWT_HMAC_SECRET: ${PRICING_DEV_JWT_HMAC_SECRET:dev-only-hmac-secret-change-me-0123456789}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/pricing_db}
    username: ${SPRING_DATASOURCE_USERNAME:pricing_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_service_pw}
pricing:
  security:
    # The team's shared development value (the same default as Document, Identity and Notification).
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
