spring:
  application:
    name: pricing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true


pricing:
  security:
    # Shared secret other services send in X-Internal-Token to call /internal/** (blank = nothing is accepted).
    internal-token: ${INTERNAL_API_TOKEN:}

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
