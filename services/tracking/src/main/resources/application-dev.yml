# Local development defaults (profile "dev"). Never use these values outside a developer machine.
# Matches the Redis and RabbitMQ containers started by the root docker-compose.yml.
# docker-compose sets SERVER_PORT=8080 inside the container; from the IDE the service listens on 8087
# (the port the API gateway expects; 8088 is the Notification Service).

server:
  port: ${SERVER_PORT:8087}

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev_redis_pw}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:swiftdrop}
    password: ${SPRING_RABBITMQ_PASSWORD:dev_rabbit_pw}

management:
  endpoint:
    health:
      show-details: always

swiftdrop:
  tracking:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
