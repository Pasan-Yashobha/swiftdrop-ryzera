services:
  # ── PostgreSQL Database for Reporting Service ──────────────────────────────
  reporting_db:
    image: postgres:16-alpine
    container_name: swiftdrop-reporting-db
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - reporting_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reporting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-net

  # ── RabbitMQ Broker with Management UI ──────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-net

  # ── Reporting Microservice (Member 10) ──────────────────────────────────────
  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftdrop-reporting-service
    depends_on:
      reporting_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://reporting_db:5432/reporting_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      REPORTING_TIMEZONE: Asia/Colombo
      SERVER_PORT: 8084
      JWT_ISSUER_URI: http://identity-service:8081
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - swiftdrop-net

volumes:
  reporting_db_data:

networks:
  swiftdrop-net:
    driver: bridge
